global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: batch-processing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - batch-processing-service:8080
        labels:
          service: spring-batch-processing-service
          environment: poc

  - job_name: monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - monolith:8080
        labels:
          service: java-wildfly-monolith
          environment: poc

  - job_name: postgres-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgresql
          environment: poc
