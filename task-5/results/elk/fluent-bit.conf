[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               kube.*
    Parser            cri
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log           On
    Merge_Log_Key       log_json
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off

[FILTER]
    Name    modify
    Match   kube.*
    Add     cluster tradeware-poc

[OUTPUT]
    Name                es
    Match               kube.*
    Host                opensearch
    Port                9200
    Index               tradeware-logs
    Type                _doc
    Logstash_Format     On
    Logstash_Prefix     tradeware
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False
